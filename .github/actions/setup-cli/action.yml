name: Set up the ailocalpack CLI
description: >
  Downloads the released ailocalpack CLI (linux-x64, self-contained single file with the JSON Schemas it was built
  with) from the GitHub Release of ailocalpack/ailocalpack named in ci/ailocalpack-cli, checks its SHA-256 before
  unpacking it, and puts it on PATH. No .NET, nothing built.
outputs:
  version:
    description: The CLI version in use.
    value: ${{ steps.pin.outputs.version }}
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: |
        pin="$GITHUB_WORKSPACE/ci/ailocalpack-cli"
        version="$(sed -n 's/^version=//p' "$pin" | tr -d '[:space:]')"
        sha256="$(sed -n 's/^sha256=//p' "$pin" | tr -d '[:space:]')"
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error file=ci/ailocalpack-cli::version= must hold a released app version (e.g. 0.1.0)"
          exit 1
        fi
        if [[ ! "$sha256" =~ ^[0-9a-f]{64}$ ]]; then
          echo "::error file=ci/ailocalpack-cli::sha256= must hold the archive's SHA-256 (64 lowercase hex)"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

    - id: cache
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/ailocalpack-cli
        key: ailocalpack-cli-release-${{ steps.pin.outputs.version }}-${{ steps.pin.outputs.sha256 }}

    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ steps.pin.outputs.version }}
        SHA256: ${{ steps.pin.outputs.sha256 }}
      run: |
        archive="$RUNNER_TEMP/ailocalpack-cli.tar.gz"
        curl -fsSL --retry 3 -o "$archive" \
          "https://github.com/ailocalpack/ailocalpack/releases/download/v$VERSION/ailocalpack-cli-$VERSION-linux-x64.tar.gz"
        echo "$SHA256  $archive" | sha256sum --check --strict
        mkdir -p "$RUNNER_TEMP/ailocalpack-cli"
        tar -xzf "$archive" -C "$RUNNER_TEMP/ailocalpack-cli"
        rm "$archive"

    - shell: bash
      env:
        VERSION: ${{ steps.pin.outputs.version }}
      run: |
        echo "$RUNNER_TEMP/ailocalpack-cli" >> "$GITHUB_PATH"
        actual="$("$RUNNER_TEMP/ailocalpack-cli/ailocalpack" --version)"
        [[ "$actual" == "$VERSION"* ]] || { echo "::error::the CLI says $actual, the pin says $VERSION"; exit 1; }
