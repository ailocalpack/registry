# Builds index.json from master and publishes it, with the pack files it points to, to GitHub Pages:
# https://ailocalpack.github.io/registry/index.json
# Every run first collects the packs' ratings from their Discussions (category "Packs"), opening one for a pack
# that has none, so likes, works / doesn't work counts and the verified status (3 confirmations of the current
# revision, see the app's docs/packs-and-registry.md) are as fresh as the last run; the schedule keeps them so.
# Nothing is committed: a failed collection fails the run and Pages keeps the previous index. GAMES.md (the list of
# games with translations) is made from the same index; when it changed, the games-list job opens or updates the
# pull request "Update GAMES.md" from the branch bot/games-md for a maintainer to merge.
name: Publish index

on:
  push:
    branches: [master]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  discussions: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          persist-credentials: false

      - uses: ./.github/actions/setup-cli

      - name: Collect ratings
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: ailocalpack ratings collect . --out "$RUNNER_TEMP/ratings.json" --repo "$REPO" --create-missing --github

      # Translation requests (Discussions in the "Requests" category): open ones go into index.json; done ones
      # (a pack exists now) and newer duplicates are closed.
      - name: Collect requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: ailocalpack requests collect . --out "$RUNNER_TEMP/requests.json" --repo "$REPO" --close --github

      - name: Build the site
        run: |
          mkdir -p _site
          # policy/verified.json (maintainers) grants or revokes verified for one pack revision.
          ailocalpack index build . --out _site/index.json --ratings "$RUNNER_TEMP/ratings.json" --requests "$RUNNER_TEMP/requests.json" --github
          # Pack files resolve relative to index.json, so the games/ tree is published next to it.
          [[ -d games ]] && cp -r games _site/games
          cp -r schemas _site/schemas

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - uses: actions/upload-artifact@v4
        with:
          name: index
          path: _site/index.json
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}index.json
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  games-list:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master

      - uses: actions/download-artifact@v4
        with:
          name: index
          path: ${{ runner.temp }}/index

      - name: Make GAMES.md
        run: python3 -I scripts/games-md.py "$RUNNER_TEMP/index/index.json" --root . --out GAMES.md

      # One pull request at a time from bot/games-md, rebuilt on master's head every time GAMES.md differs from
      # master's. A pull request opened with the workflow token starts no workflows, so a maintainer merges it past
      # the required check (Repository settings in README.md).
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: bot/games-md
        run: |
          if git diff --quiet -- GAMES.md && git ls-files --error-unmatch GAMES.md >/dev/null 2>&1; then
            echo "GAMES.md is up to date."
            exit 0
          fi
          if git fetch -q origin "$BRANCH" 2>/dev/null && git diff --quiet FETCH_HEAD -- GAMES.md \
             && [[ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]]; then
            echo "The open pull request already has this GAMES.md."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add GAMES.md
          git commit -q -m "Update GAMES.md"
          git push -f origin "$BRANCH"
          if [[ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]]; then
            gh pr create --base master --head "$BRANCH" --title "Update GAMES.md" \
              --body "The list of games with translations, made by \`scripts/games-md.py\` from the index Publish just built. Merge as is; the next run rebuilds this branch if more packs arrive first."
          fi
